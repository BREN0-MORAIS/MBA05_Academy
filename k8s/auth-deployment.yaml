apiVersion: apps/v1
kind: Deployment
metadata:
  name: academyio-auth
  namespace: academyio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academyio-auth
  template:
    metadata:
      labels:
        app: academyio-auth
    spec:
      containers:
        - name: auth
          image: brenodev29/academyio:auth
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: MessageQueueConnection__MessageBus
              valueFrom:
                secretKeyRef:
                  name: messagebus-secret
                  key: connection
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
      # Uncomment and set if using private registry
      # imagePullSecrets:
      #  - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: academyio-auth
  namespace: academyio
spec:
  selector:
    app: academyio-auth
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
