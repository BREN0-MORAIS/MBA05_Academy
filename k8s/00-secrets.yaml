# ===========================================
# AcademyIO - Kubernetes Secrets
# ===========================================
# IMPORTANTE: Este arquivo contem valores PLACEHOLDER.
# Em producao, NAO commite secrets reais no repositorio!
#
# Para criar secrets de forma segura:
#
# 1. Via kubectl (recomendado para producao):
#    kubectl create secret generic messagebus-secret \
#      --namespace=academyio \
#      --from-literal=connection='host=rabbitmq;username=<USER>;password=<PASS>'
#
# 2. Via GitHub Secrets + CI/CD:
#    Configure os secrets no GitHub e use o pipeline para criar os secrets no cluster.
#
# 3. Via ferramentas de gerenciamento de secrets:
#    - HashiCorp Vault
#    - Azure Key Vault
#    - AWS Secrets Manager
#    - Sealed Secrets (Bitnami)
#
# O valor abaixo e apenas um PLACEHOLDER para desenvolvimento local.
# Substitua por secrets reais antes de implantar em producao!
# ===========================================
apiVersion: v1
kind: Secret
metadata:
  name: messagebus-secret
  namespace: academyio
  labels:
    app: academyio
    environment: development
  annotations:
    description: "RabbitMQ connection string - PLACEHOLDER for development"
type: Opaque
data:
  # PLACEHOLDER - Decodifica para: host=rabbitmq;username=guest;password=guest
  # Em producao, substitua por credenciais seguras!
  connection: aG9zdD1yYWJiaXRtcTt1c2VybmFtZT1ndWVzdDtwYXNzd29yZD1ndWVzdA==
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: academyio
  labels:
    app: academyio
    environment: development
  annotations:
    description: "JWT signing key - PLACEHOLDER for development"
type: Opaque
data:
  # PLACEHOLDER - Em producao, use uma chave forte gerada aleatoriamente
  # Gere com: openssl rand -base64 64
  secret: UExBQ0VIT0xERVItR0VORVJBVEVOLVNFQ1VSRS1LRVktSU4tUFJPRFVDVElPTg==
