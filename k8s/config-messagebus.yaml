apiVersion: v1
kind: ConfigMap
metadata:
  name: messagebus-config
  namespace: academyio
data:
  # Non-sensitive defaults (keep only non-secret values)
  connection_placeholder: "host=rabbitmq:5672;username=guest;password=REDACTED;publisherConfirms=true;timeout=10"
  # Secret `messagebus-secret` contains the real connection string under key `connection`
