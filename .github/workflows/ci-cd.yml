name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '8.0.x'
  DOCKER_HUB_USERNAME: brenodev29
  DOCKER_HUB_REPOSITORY: academyio

jobs:
  # ============================================
  # JOB 1: Build e Testes
  # ============================================
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore AcademyIO.sln

      - name: Build da solucao
        run: dotnet build AcademyIO.sln --configuration Release --no-restore

      - name: Executar testes unitarios
        run: dotnet test tests/AcademyIO.Tests.Unit/AcademyIO.Tests.Unit.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Executar testes de integracao
        run: dotnet test tests/AcademyIO.Tests.Integration/AcademyIO.Tests.Integration.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
        continue-on-error: true

      - name: Upload de cobertura de codigo
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # JOB 2: Analise de Codigo
  # ============================================
  code-analysis:
    name: Analise de Codigo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore AcademyIO.sln

      - name: Executar analise com dotnet format
        run: dotnet format AcademyIO.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  # ============================================
  # JOB 3: Build de Imagens Docker
  # ============================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: ./src/services/AcademyIO.Auth.API/Dockerfile
          - name: courses
            dockerfile: ./src/services/AcademyIO.Courses.API/Dockerfile
          - name: payments
            dockerfile: ./src/services/AcademyIO.Payments.API/Dockerfile
          - name: students
            dockerfile: ./src/services/AcademyIO.Students.API/Dockerfile
          - name: bff
            dockerfile: ./src/api-gateways/AcademyIO.Bff/Dockerfile

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ matrix.service.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 4: Push para Docker Hub (apenas main)
  # ============================================
  docker-push:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: ./src/services/AcademyIO.Auth.API/Dockerfile
          - name: courses
            dockerfile: ./src/services/AcademyIO.Courses.API/Dockerfile
          - name: payments
            dockerfile: ./src/services/AcademyIO.Payments.API/Dockerfile
          - name: students
            dockerfile: ./src/services/AcademyIO.Students.API/Dockerfile
          - name: bff
            dockerfile: ./src/api-gateways/AcademyIO.Bff/Dockerfile

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build e Push da imagem ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ matrix.service.name }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ matrix.service.name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 5: Validacao de Manifests Kubernetes
  # ============================================
  validate-k8s:
    name: Validar Manifests Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Validar manifests YAML
        run: |
          for file in k8s/*.yaml; do
            echo "Validando $file..."
            kubectl apply --dry-run=client -f "$file" || true
          done

  # ============================================
  # JOB 6: Seguranca - Scan de Vulnerabilidades
  # ============================================
  security-scan:
    name: Scan de Seguranca
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Executar Trivy para scan de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
        continue-on-error: true
